[project]
name = "magenta"
version = "0.1.0"
description = "Magenta Retain — causal-uplift telecom churn retention agent"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "langsmith>=0.1.100",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "scikit-uplift>=0.5.1",
    "joblib>=1.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "numba>=0.59",
    "llvmlite>=0.42",
    "sentence-transformers>=5.6.0",
    "tqdm>=4.68.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "clerk-backend-api>=7.0",
    "procrastinate>=3.0",
    "structlog>=24.1",
]

[project.scripts]
magenta = "magenta.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magenta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: real end-to-end runs (trained model artifacts, LLM stubs) — deselected by default via `-m \"not slow\"`",
    "hardcheck: deterministic pass/fail compliance invariants (run with -m hardcheck)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Deliberately not enabling BLE (blind-except): several `except Exception` blocks are
# intentional degradation paths (llm.py fallbacks, auth.py token rejection) and would
# each need a noqa. Revisit once those are the only ones left.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is formatted, not linted

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)` default-arg pattern is the framework's own
# documented idiom, not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
# Third-party ML libraries ship no stubs; this removes ~60 import-not-found errors that
# say nothing about our code.
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["alembic/"]
