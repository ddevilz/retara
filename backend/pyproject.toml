[project]
name = "magenta"
version = "0.1.0"
description = "Magenta Retain — causal-uplift telecom churn retention agent"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "langsmith>=0.1.100",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "scikit-uplift>=0.5.1",
    "joblib>=1.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "numba>=0.59",
    "llvmlite>=0.42",
    "sentence-transformers>=5.6.0",
    "tqdm>=4.68.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.scripts]
magenta = "magenta.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magenta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: real end-to-end runs (trained model artifacts, LLM stubs) — deselected by default via `-m \"not slow\"`",
    "hardcheck: deterministic pass/fail compliance invariants (run with -m hardcheck)",
]
