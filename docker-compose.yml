# Alternative to a native install. Do not run alongside a native Postgres on 5433.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: magenta
      POSTGRES_PASSWORD: magenta
      POSTGRES_DB: magenta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magenta"]
      interval: 2s
      timeout: 3s
      retries: 20
